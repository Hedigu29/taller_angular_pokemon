<main class="page">
  <section class="card">
    <header class="card__header">
      <span class="badge">PokeAPI</span>
      <h1 class="title">Buscador de Pokémon</h1>
      <p class="subtitle">Escribe un nombre (por ejemplo: ditto) y presiona buscar.</p>
    </header>

    <form class="search" (ngSubmit)="buscar()">
      <input
        class="search__input"
        type="text"
        name="query"
        [(ngModel)]="query"
        placeholder="ditto, pikachu, charizard..."
        autocomplete="off"
        aria-label="Nombre del Pokémon"
      />
      <button class="search__button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Buscando...' : 'Buscar' }}
      </button>
    </form>

    @if (error()) {
      <p class="message message--error" role="alert">{{ error() }}</p>
    }

    @if (pokemon(); as p) {
      <article class="result">
        @if (p.image) {
          <img class="result__image" [src]="p.image" [alt]="'Imagen de ' + p.name" />
        }
        <h2 class="result__name">{{ p.name }}</h2>
      </article>
    }
  </section>
</main>
